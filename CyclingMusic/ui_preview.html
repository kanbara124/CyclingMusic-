<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骑行音乐 - iOS风格界面设计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
        }

        .phone {
            width: 375px;
            height: 812px;
            background: #F2F2F7;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .screen {
            width: 100%;
            height: 100%;
            padding: 50px 16px 16px;
            overflow-y: auto;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        /* Main Screen */
        .main-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 16px;
        }

        .cadence-display {
            text-align: center;
            margin-bottom: 32px;
        }

        .cadence-value {
            font-size: 72px;
            font-weight: 200;
            color: #000000;
            line-height: 1;
        }

        .cadence-label {
            font-size: 13px;
            color: #8E8E93;
            font-weight: 500;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: flex;
            gap: 16px;
        }

        .stat-item {
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 200;
            color: #000000;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: #8E8E93;
        }

        .btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #007AFF;
            color: #FFFFFF;
            margin-bottom: 12px;
        }

        .btn-primary:active {
            background: #0051D5;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: transparent;
            color: #007AFF;
            border: 1px solid #007AFF;
            height: 48px;
        }

        .btn-secondary:active {
            background: rgba(0, 122, 255, 0.1);
        }

        .btn-success {
            background: #34C759;
            color: #FFFFFF;
        }

        .btn-success:active {
            background: #2DA94C;
            transform: scale(0.98);
        }

        /* History Screen */
        .header {
            background: #FFFFFF;
            padding: 12px 16px;
            margin: -50px -16px 16px;
            padding-top: 62px;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
        }

        .back-btn {
            background: transparent;
            border: none;
            font-size: 28px;
            color: #007AFF;
            cursor: pointer;
            padding: 0;
            width: 48px;
            height: 48px;
            font-weight: 300;
        }

        .header-title {
            font-size: 28px;
            font-weight: 500;
            color: #000000;
            margin-left: 8px;
        }

        .summary-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 16px;
        }

        .summary-title {
            font-size: 17px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 16px;
        }

        .summary-stats {
            display: flex;
            gap: 16px;
        }

        .summary-item {
            flex: 1;
            text-align: center;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 200;
            color: #000000;
        }

        .summary-label {
            font-size: 13px;
            color: #8E8E93;
            margin-top: 4px;
        }

        .history-item {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .history-date {
            font-size: 17px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 12px;
        }

        .divider {
            height: 1px;
            background: #C6C6C8;
            margin: 12px 0;
        }

        .history-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .history-stat {
            display: flex;
            flex-direction: column;
        }

        .history-stat-label {
            font-size: 13px;
            color: #8E8E93;
            margin-bottom: 4px;
        }

        .history-stat-value {
            font-size: 17px;
            font-weight: 500;
            color: #000000;
        }

        .screen-label {
            text-align: center;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 500;
            margin-top: 16px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Screen -->
        <div>
            <div class="phone">
                <div class="screen">
                    <div class="main-card">
                        <div class="cadence-display">
                            <div class="cadence-value">85</div>
                            <div class="cadence-label">RPM</div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-value">12.5</div>
                                <div class="stat-label">距离 (km)</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">45:32</div>
                                <div class="stat-label">时间</div>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-success">停止骑行</button>
                    <button class="btn btn-secondary">查看历史记录</button>
                </div>
            </div>
            <div class="screen-label">主界面 - 骑行中</div>
        </div>

        <!-- History Screen -->
        <div>
            <div class="phone">
                <div class="screen">
                    <div class="header">
                        <button class="back-btn">‹</button>
                        <div class="header-title">骑行记录</div>
                    </div>

                    <div class="summary-card">
                        <div class="summary-title">总览</div>
                        <div class="summary-stats">
                            <div class="summary-item">
                                <div class="summary-value">24</div>
                                <div class="summary-label">次数</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-value">156.8</div>
                                <div class="summary-label">公里</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-value">12:45</div>
                                <div class="summary-label">时长</div>
                            </div>
                        </div>
                    </div>

                    <div class="history-item">
                        <div class="history-date">2024-01-15 09:30</div>
                        <div class="divider"></div>
                        <div class="history-stats">
                            <div class="history-stat">
                                <div class="history-stat-label">距离</div>
                                <div class="history-stat-value">12.5 km</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">时长</div>
                                <div class="history-stat-value">45:32</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">平均踏频</div>
                                <div class="history-stat-value">85 RPM</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">平均速度</div>
                                <div class="history-stat-value">16.5 km/h</div>
                            </div>
                        </div>
                    </div>

                    <div class="history-item">
                        <div class="history-date">2024-01-14 18:15</div>
                        <div class="divider"></div>
                        <div class="history-stats">
                            <div class="history-stat">
                                <div class="history-stat-label">距离</div>
                                <div class="history-stat-value">8.3 km</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">时长</div>
                                <div class="history-stat-value">28:45</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">平均踏频</div>
                                <div class="history-stat-value">78 RPM</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">平均速度</div>
                                <div class="history-stat-value">17.3 km/h</div>
                            </div>
                        </div>
                    </div>

                    <div class="history-item">
                        <div class="history-date">2024-01-13 07:00</div>
                        <div class="divider"></div>
                        <div class="history-stats">
                            <div class="history-stat">
                                <div class="history-stat-label">距离</div>
                                <div class="history-stat-value">15.2 km</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">时长</div>
                                <div class="history-stat-value">52:18</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">平均踏频</div>
                                <div class="history-stat-value">82 RPM</div>
                            </div>
                            <div class="history-stat">
                                <div class="history-stat-label">平均速度</div>
                                <div class="history-stat-value">17.4 km/h</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="screen-label">历史记录界面</div>
        </div>
    </div>
</body>
</html>
